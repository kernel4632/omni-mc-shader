# 双平台检查：复用本地测试和构建，不运行游戏或显卡测试。
name: 检查与构建
on: # 每次主分支变化或审查请求都核对同一源码。
  push: # 自动触发只面向已授权合并的主分支。
    branches: [main] # 临时分支由拉取请求检查，避免重复运行。
  pull_request: # 草稿代码先通过可重复的离线检查。
  workflow_dispatch: # 工具更新也可手工触发离线检查。
permissions:
  contents: read # 构建不修改代码、标签或发行版。
jobs:
  check:
    name: 检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }} # 两个平台都必须检查路径与压缩包差异。
    timeout-minutes: 15 # 失败构建不能无限占用运行器。
    strategy:
      fail-fast: false # 一个系统失败仍保留另一个系统结果。
      matrix:
        os: [ubuntu-latest, windows-latest] # 同一压缩包协议在两个系统执行。
    steps:
      - name: 读取代码
        uses: actions/checkout@v6 # 检查当前提交，不读取玩家目录。
      - name: 准备 Python
        uses: actions/setup-python@v6 # 使用项目要求的解释器版本。
        with:
          python-version: '3.12' # 保持安全解压等标准库接口一致。
      - name: 安装锁定检查工具
        run: python dev.py setup # 按哈希安装工具并生成菜单与入口。
      - name: 检查自动化工具
        run: python -m unittest discover -s tests # 包含非法配置与离线优化回归。
      - name: 检查并打包光影
        run: python build.py build # 链接代表配置后才生成可分发资源。
      - name: 上传检查产物
        uses: actions/upload-artifact@v4 # 只保留离线产物，不声称游戏验证。
        with:
          name: Omni-${{ runner.os }} # 各系统产物分开供字节对照。
          path: dist/
          if-no-files-found: error # 没有有效ZIP不能算交付成功。
