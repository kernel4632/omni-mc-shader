# 单次快速检查：工具测试与关键编译并行，十秒预算，不运行游戏。
name: 检查与构建
on: # 每次主分支变化或审查请求都核对同一源码。
  push: # 自动触发只面向已授权合并的主分支。
    branches: [main] # 临时分支由拉取请求检查，避免重复运行。
  pull_request: # 草稿代码先通过可重复的离线检查。
  workflow_dispatch: # 工具更新也可手工触发离线检查。
permissions:
  contents: read # 构建不修改代码、标签或发行版。
concurrency: # 新提交替换过时检查，避免同时浪费运行器时间。
  group: check-${{ github.workflow }}-${{ github.ref }} # 不同审查分支仍独立执行。
  cancel-in-progress: true # 同一分支只关心最新提交结果。
jobs:
  check:
    name: 快速检查
    runs-on: ubuntu-latest # 编译检查只执行一次，不在另一个系统重复同样的工作。
    timeout-minutes: 3 # 排队不计入；下载与上传受平台限制，实际检查另有十秒预算。
    steps:
      - name: 读取代码
        uses: actions/checkout@v7 # 检查当前提交，不读取玩家目录。
      - name: 准备 Python
        uses: actions/setup-python@v6 # 使用项目要求的解释器版本。
        with:
          python-version: '3.12' # 保持安全解压等标准库接口一致。
      - name: 缓存编译工具与结果
        uses: actions/cache@v4 # 同一源码与工具再次运行时跳过重复编译。
        with:
          path: | # 工具按锁定哈希缓存；编译结果按源码内容缓存。
            .dev/tools
            .dev/reports/glsl-cache.json
          key: omni-build-${{ runner.os }}-${{ hashFiles('dev-tools.lock.json','shaders/**','presets/**','build.py','options.py','config.py','audit.py') }}
          restore-keys: | # 内容未命中时退回同系统较新的缓存，仅复用工具。
            omni-build-${{ runner.os }}-
      - name: 安装锁定检查工具
        run: python dev.py setup # 按哈希安装工具并生成菜单与入口。
      - name: 十秒检查并打包
        run: python build.py verify # 工具测试与关键编译并行，总预算十秒；超时失败。
      - name: 上传检查产物
        uses: actions/upload-artifact@v4 # 只保留离线产物，不声称游戏验证。
        with:
          name: Omni # 一份实际构建产物即可供下载，不重复打包。
          path: dist/
          if-no-files-found: error # 没有有效ZIP不能算交付成功。
