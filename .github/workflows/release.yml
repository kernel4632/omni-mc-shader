# v 标签与 VERSION 一致并通过检查后，自动创建 GitHub 版本。
name: 发布光影版本

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已推送的版本标签，例如 v0.0.0-dev.1'
        required: true
        type: string
      draft:
        description: '创建草稿版本，用于验证发布流程'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 读取版本代码
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: 准备 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 验证版本标签
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python build.py version --tag "$RELEASE_TAG"
      - name: 安装锁定检查工具
        run: python dev.py setup
      - name: 检查自动化工具
        run: python -m unittest discover -s tests
      - name: 检查并打包
        run: python build.py build
      - name: 从当前版本更新记录生成发行说明
        run: python build.py notes --output dist/release-notes.md
      - name: 创建 GitHub 版本并上传文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_DRAFT: ${{ inputs.draft || false }}
        run: |
          args=(--verify-tag --notes-file dist/release-notes.md --title "Omni $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if [[ "$RELEASE_DRAFT" == "true" ]]; then args+=(--draft); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt "${args[@]}"
