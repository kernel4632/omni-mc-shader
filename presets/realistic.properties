# @preset {"label":{"zh_cn":"真实画面","en_us":"Realistic"}}
# 色彩保持克制，提高阴影与云质量；尚未实测性能。
# 以下设置组成真实预设的独立效果开关与质量边界。
# 物理光照负责高光与反射滤波。
OMNI_ENABLE_PBR=true
# 视差遮挡贴图使用步进加细化。
OMNI_PARALLAX_MODE=2
# 可变半影阴影打开。
OMNI_VARIABLE_PENUMBRA_SHADOWS=true
# 阴影采样提高到较高档。
OMNI_VPS_QUALITY=24
# 彩色半透明阴影打开。
OMNI_COLORED_SHADOWS=true
# 屏幕空间阴影打开，补足阴影贴图分辨率外的细节。
OMNI_SCREEN_SPACE_SHADOWS=true
# 反射阴影图全局光打开。
OMNI_GI_RSM=true
# 地平线遮蔽打开。
OMNI_GTAO=true
# 提高遮蔽采样质量。
OMNI_GTAO_QUALITY=6
# 体积雾打开。
OMNI_VFOG=true
# 体积雾采样质量提高。
OMNI_VFOG_QUALITY=10
# 体积雾启用体积光，让光柱可见。
OMNI_VFOG_VOLUMETRIC_LIGHTING=true
# 水下体积光打开。
OMNI_UNDERWATER_VFOG=true
# 地表大气散射打开。
OMNI_LANDSCATTERING=true
# 体积云打开。
OMNI_VOLUMETRIC_CLOUDS=true
# 云采样质量提高。
OMNI_CLOUD_QUALITY=1.6
# 云影贴图打开。
OMNI_CLOUD_SHADOW=true
# 时间抗锯齿打开。
OMNI_TAA=true
# 历史权重取较高值，静态画面更干净。
OMNI_TAA_BLENDWEIGHT=0.97
# 泛光打开。
OMNI_BLOOM=true
# 泛光强度保持低值，避免覆盖道路细节。
OMNI_BLOOM_AMOUNT=0.1
# 运动模糊打开。
OMNI_MOTION_BLUR=true
# 镜头眩光打开。
OMNI_LENS_GLARE=true
# 景深保持关闭以省开销。
OMNI_DOF=false
# 打开高级调色。
OMNI_ADVANCED_COLOR=true
# 降低饱和度保持中性材质颜色。
OMNI_SATURATION=0.9
# 色调映射保持 AgX。
OMNI_TONEMAP_OPERATOR=0
