# @preset {"label":{"zh_cn":"真实画面","en_us":"Realistic"}}
# 色彩保持克制，提高阴影与云质量；尚未实测性能。
# 以下设置组成真实预设的独立效果开关与质量边界。
# 阴影使用五乘五柔化核，减少远处硬边。
OMNI_SHADOW_QUALITY=5
# 时间抗锯齿在运动中依赖历史深度裁剪。
OMNI_AA_MODE=2
# 屏幕反射只使用屏幕内的真实命中。
OMNI_SSR=true
# 环境遮蔽只压暗实际邻点遮挡。
OMNI_SSAO=true
# 一次屏幕可见辐射反弹，不是完整全局光。
OMNI_SCREEN_BOUNCE=true
# 自动曝光使用当前画面亮度和有效历史。
OMNI_AUTO_EXPOSURE=true
# 降低饱和度保持中性材质颜色。
OMNI_SATURATION=0.75
# 提高明暗分离但不改变曝光目标。
OMNI_CONTRAST=1.1
# 发光区域才会进入泛光采样。
OMNI_BLOOM_ENABLED=true
# 泛光强度保持低值，避免覆盖道路细节。
OMNI_BLOOM_STRENGTH=0.1
