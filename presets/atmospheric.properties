# @preset {"label":{"zh_cn":"氛围画面","en_us":"Atmospheric"}}
# 氛围只改变外观，不代表真实天气或物理模拟。
# 以下设置只改变可见气氛，不改变世界逻辑。
# 体积光沿视线累积阴影可见性。
OMNI_VFOG_VOLUMETRIC_LIGHTING=true
# 夜间天空增加空间帘幕颜色。
OMNI_AURORA=true
# 雨后太阳方向生成彩虹带。
OMNI_RAINBOW=true
# 泛光只扩散高于显示白点的线性光。
OMNI_BLOOM=true
# 氛围预设使用较明显的泛光。
OMNI_BLOOM_AMOUNT=0.5
# 历史抗锯齿减轻云和反射闪烁。
OMNI_TAA=true
# 光线变化时自动调整测光结果。
OMNI_MANUAL_EXPOSURE=false
# 打开高级调色，允许单独调整饱和度与伽马。
OMNI_ADVANCED_COLOR=true
# 镜头边缘降低亮度，中心保持可读。
OMNI_VIGNETTE=true
# 暗角衰减取中等强度。
OMNI_VIGNETTE_FALLOFF=0.6
# 水面雨点圈跟随降雨生成。
OMNI_RAIN_SPLASH_EFFECT=true
