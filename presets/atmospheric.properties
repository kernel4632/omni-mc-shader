# @preset {"label":{"zh_cn":"氛围画面","en_us":"Atmospheric"}}
# 氛围只改变外观，不代表真实天气或物理模拟。
# 以下设置只改变可见气氛，不改变世界逻辑。
OMNI_CLOUD_MODE=2
# 体积光只沿视线累积阴影可见性。
OMNI_VOLUMETRIC_LIGHT=true
# 夜间天空增加空间帘幕颜色。
OMNI_AURORA=true
# 雨后太阳方向生成彩虹带。
OMNI_RAINBOW=true
# 泛光只扩散高于显示白点的线性光。
OMNI_BLOOM_ENABLED=true
# 氛围预设使用较明显的泛光。
OMNI_BLOOM_STRENGTH=0.5
# 历史抗锯齿减轻云和反射闪烁。
OMNI_AA_MODE=2
# 光线变化时自动调整测光结果。
OMNI_AUTO_EXPOSURE=true
# 稍微暖化白平衡，不改变线性照明。
OMNI_WHITE_BALANCE=0.5
# 镜头边缘降低亮度，中心保持可读。
OMNI_VIGNETTE=0.1
# 只在水面附近和相机移动时生成解析圆环。
OMNI_PLAYER_RIPPLES=true
