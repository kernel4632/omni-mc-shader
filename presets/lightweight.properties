# @preset {"label":{"zh_cn":"轻量画面","en_us":"Lightweight"}}
# 关闭独立阴影与邻域计算；档位名称不表示已测量帧率。
# 以下设置只保留基础照明和低采样路径。
OMNI_SHADOW_ENABLED=false
# 关闭屏幕空间射线步进。
OMNI_SSR=false
# 关闭邻点深度遮蔽采样。
OMNI_SSAO=false
# 关闭屏幕可见辐射反弹。
OMNI_SCREEN_BOUNCE=false
# 轻量档降低云采样次数。
OMNI_CLOUD_STEPS=8
# 不读取周围像素生成泛光。
OMNI_BLOOM_ENABLED=false
# 不启用抗锯齿，省下历史重建开销。
OMNI_AA_ENABLED=false
# 不改变植被顶点位置。
OMNI_VEGETATION_WIND=false
# 不读取雨滴空间格点。
OMNI_RAIN_RIPPLES=false
# 反射强度为零时跳过天空与SSR调用。
OMNI_REFLECTION_STRENGTH=0.0
# 不做 GGX 镜面高光，省下材质镜面计算。
OMNI_SPECULAR=0
# 关闭气候温度噪声采样。
OMNI_CLIMATE=0
# 不做云影步进采样。
OMNI_CLOUD_SHADOW=0
# 不做水面多层噪声凹凸。
OMNI_WATER_BUMP=0
# 不做盖斯特纳海浪顶点抬升。
OMNI_OCEAN_WAVES=0
# 关闭水下体积光柱。
OMNI_UNDERWATER_FOG=0
# 关闭末地雾，使用基础天空色。
OMNI_END_FOG=0
# 关闭镜头耀斑采样。
OMNI_LENS_FLARE=0
