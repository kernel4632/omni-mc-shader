# @preset {"label":{"zh_cn":"轻量画面","en_us":"Lightweight"}}
# 关闭独立阴影与邻域计算；档位名称不表示已测量帧率。
# 以下设置只保留基础照明和低采样路径。
OMNI_SHADOW_ENABLED=false
# 关闭屏幕空间射线步进。
OMNI_SSR=false
# 关闭邻点深度遮蔽采样。
OMNI_SSAO=false
# 关闭屏幕可见辐射反弹。
OMNI_SCREEN_BOUNCE=false
# 轻量档只使用单层云采样。
OMNI_CLOUD_MODE=1
# 不读取周围像素生成泛光。
OMNI_BLOOM_ENABLED=false
# 使用单帧边缘平滑，不保留时间历史。
OMNI_AA_MODE=1
# 不改变植被顶点位置。
OMNI_VEGETATION_WIND=false
# 不读取雨滴空间格点。
OMNI_RAIN_RIPPLES=false
# 反射强度为零时跳过天空与SSR调用。
OMNI_REFLECTION_STRENGTH=0.0
