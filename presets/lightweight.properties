# @preset {"label":{"zh_cn":"轻量画面","en_us":"Lightweight"}}
# 关闭独立阴影与邻域计算；档位名称不表示已测量帧率。
# 以下设置只保留基础照明和低采样路径。
# 关闭可变半影，改用基础阴影比较。
OMNI_VARIABLE_PENUMBRA_SHADOWS=false
# 阴影采样降到最低档。
OMNI_VPS_QUALITY=4
# 不做彩色半透明阴影。
OMNI_COLORED_SHADOWS=false
# 不做屏幕空间阴影。
OMNI_SCREEN_SPACE_SHADOWS=false
# 关闭反射阴影图全局光。
OMNI_GI_RSM=false
# 关闭地平线遮蔽。
OMNI_GTAO=false
# 关闭体积雾。
OMNI_VFOG=false
# 关闭水下体积光。
OMNI_UNDERWATER_VFOG=false
# 关闭地表大气散射。
OMNI_LANDSCATTERING=false
# 关闭体积云。
OMNI_VOLUMETRIC_CLOUDS=false
# 只保留平面云。
OMNI_PLANAR_CLOUDS=true
# 云采样降到最低档。
OMNI_CLOUD_QUALITY=0.4
# 不做云影贴图。
OMNI_CLOUD_SHADOW=false
# 关闭泛光。
OMNI_BLOOM=false
# 关闭时间抗锯齿，省下历史重建开销。
OMNI_TAA=false
# 关闭物理光照，省下高光与反射滤波。
OMNI_ENABLE_PBR=false
# 关闭水面视差。
OMNI_WATER_PARALLAX=false
# 关闭焦散。
OMNI_CAUSTICS=false
# 关闭水后雾。
OMNI_UNDERWATER_FOG=false
# 关闭景深。
OMNI_DOF=false
# 关闭运动模糊。
OMNI_MOTION_BLUR=false
# 关闭镜头眩光。
OMNI_LENS_GLARE=false
# 关闭镜头光斑。
OMNI_LENS_FLARE=false
# 关闭次表面散射的多次采样。
OMNI_SSS_QUALITY=2
# 关闭远景阴影。
OMNI_DH_SHADOW=false
