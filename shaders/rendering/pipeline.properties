# 加载器设置来源：从 iterationT 3.2.0 的 shaders.properties 一比一移植（菜单之前的全部设置）。
# 这个文件只写加载器设置；菜单、滑块和预设由 options.py 从效果源码生成，不能在这里重复维护。
# 选项名按移植合同加 `OMNI_` 前缀；根目录程序改成 `world0/` 前缀，其他维度照原样。
# 键名、取值和顺序都照原程序，便于逐行对照；条件分支由加载器按玩家选项挑选，同一时刻只有一支生效。

# --- 原版渲染开关：哪些原版绘制保留或关闭 ---
# 原版云不画：云由自定义合成路径绘制，混进原版云会画两遍。
clouds = off
# 动态手持光关闭，手持光源改由光影自己按位置计算。
dynamicHandLight = false
# 旧版手持光关闭。
oldHandLight = false
# 旧版光照关闭，光照由延迟阶段接管。
oldLighting = false
# 水下覆盖层关闭，水下画面由光影自己处理。
underwaterOverlay = false
# 半透明物体参与阴影绘制。
shadowTranslucent = true
# 太阳几何不画：天空背景全部由延迟阶段的自定义天空绘制，天空像素里只留日月贴图。
sun = false
# 月亮几何照画，供天空效果读取月亮贴图。
moon = true
# 星星几何照画，供天空效果读取星空。
stars = true
# 原版暗角关闭，暗角由后期阶段自己算。
vignette = false
# 环境光遮蔽分开处理，避免原版遮蔽和 `GTAO` 叠加两次。
separateAo = true
# 视锥剔除开启，交给加载器剔除看不见的区块。
frustum.culling = true
# 阴影剔除关闭，阴影相机覆盖的范围和主相机不同，剔除会漏掉投影物。
shadow.culling = false
# 粒子在延迟阶段之前绘制，让粒子能读到延迟阶段算出的光照。
particles.before.deferred = false

