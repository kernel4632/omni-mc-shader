# 加载器设置来源：菜单生成器保留这些键值与中文说明。
# 主世界阴影开关与两种其他维度保持一致。
program.world0/shadow.enabled=OMNI_SHADOW_ENABLED
# 下界复用同一选项，不依赖被忽略的根目录程序。
program.world-1/shadow.enabled=OMNI_SHADOW_ENABLED
# 末地独立入口也可以关闭阴影绘制。
program.world1/shadow.enabled=OMNI_SHADOW_ENABLED
# DH阴影未实现，明确禁用独立远景阴影绘制。
dhShadow.enabled=false
# 云由自定义合成路径计算，不混入原版云。
clouds=off
# 日月贴图交给加载器按资源包提供，是否显示由天空效果里的「使用资源包天空」决定。
sun=true
# 月亮贴图同样交给加载器提供，显示与否由同一个选项决定。
moon=true
# 星空由球面固定随机点生成。
stars=false
# 可选实体分离缺失时使用透明拒绝策略；计算着色器缺失时跳过 LPV 计算。
iris.features.optional=ENTITY_TRANSLUCENT COMPUTE_SHADERS
# 支持该能力时分开不透明与半透明粒子。
particles.ordering=mixed
# 近景水的几何有效标志不能随颜色透明混合。
blend.gbuffers_water.colortex7=off
# 水法线和实际视深度来自同一个片元，禁止插值混合。
blend.gbuffers_water.colortex8=off
# DH水表面标志只对应自己的投影。
blend.dh_water.colortex7=off
# DH水的米制深度不可按颜色透明度混合。
blend.dh_water.colortex8=off
# 基础覆盖没有可靠对应深度，只写无效标志。
blend.gbuffers_basic.colortex7=off
# 线条覆盖不能修改底层表面的历史有效性。
blend.gbuffers_line.colortex7=off
# 天空基础程序不产生表面法线元数据。
blend.gbuffers_skybasic.colortex7=off
# 天空贴图覆盖只贡献颜色。
blend.gbuffers_skytextured.colortex7=off
# 原版云程序即使被调用也不产生表面匹配信息。
blend.gbuffers_clouds.colortex7=off
# 实体分离能力可用时保留不透明实体的真实标志。
blend.gbuffers_entities.colortex7=off
# 发光实体覆盖只写自身颜色和无效标志。
blend.gbuffers_entities_glowing.colortex7=off
# 不透明方块实体与地形保持同一有效性约定。
blend.gbuffers_block.colortex7=off
# 半透明实体的混合颜色不当作单一表面。
blend.gbuffers_entities_translucent.colortex7=off
# 半透明方块实体保留底层类别与材质。
blend.gbuffers_block_translucent.colortex7=off
# 手持透明覆盖不参与全像素几何后处理。
blend.gbuffers_hand_water.colortex7=off
# 雨雪天气没有匹配的不透明表面深度。
blend.gbuffers_weather.colortex7=off
# 半透明粒子不进入底层深度的时间历史。
blend.gbuffers_particles_translucent.colortex7=off
# 普通纹理覆盖也必须拒绝底层元数据匹配。
blend.gbuffers_textured.colortex7=off
# 已照亮的纹理覆盖仍不提供可靠的单一表面。
blend.gbuffers_textured_lit.colortex7=off
# 基础粒子与半透明粒子使用同一拒绝标志。
blend.gbuffers_particles.colortex7=off
# 方块破坏只叠加纹理，不能改底层材质。
blend.gbuffers_damagedblock.colortex7=off
# 附魔光只改变颜色，不改变几何表面。
blend.gbuffers_armor_glint.colortex7=off
# 眼部发光不应使底层法线产生错误反射。
blend.gbuffers_spidereyes.colortex7=off
# 光束覆盖缺少可用于表面算法的唯一深度。
blend.gbuffers_beaconbeam.colortex7=off
# 光传播体积：计算阶段写入，片元阶段读取；未游戏验证，缺少计算能力时回退屏幕空间间接光。
image.omniLpvA = omniLpvTex RGB RGBA8 UNSIGNED_BYTE false false 8 8 8
# 传播目标图像与源图像交替使用同一个体积格。
image.omniLpvB = omniLpvTexB RGB RGBA8 UNSIGNED_BYTE false false 8 8 8
# 渲染缩放的缓冲尺寸由菜单生成器按「渲染缩放」选项的值自动写出，见 options.py，不在这里手工维护。
