# 加载器设置来源：从 iterationT 3.2.0 的 shaders.properties 一比一移植（菜单之前的全部设置）。
# 这个文件只写加载器设置；菜单、滑块和预设由 options.py 从效果源码生成，不能在这里重复维护。
# 选项名按移植合同加 `OMNI_` 前缀；根目录程序改成 `world0/` 前缀，其他维度照原样。
# 键名、取值和顺序都照原程序，便于逐行对照；条件分支由加载器按玩家选项挑选，同一时刻只有一支生效。

# --- 原版渲染开关：哪些原版绘制保留或关闭 ---
# 原版云不画：云由自定义合成路径绘制，混进原版云会画两遍。
clouds = off
# 动态手持光关闭，手持光源改由光影自己按位置计算。
dynamicHandLight = false
# 旧版手持光关闭。
oldHandLight = false
# 旧版光照关闭，光照由延迟阶段接管。
oldLighting = false
# 水下覆盖层关闭，水下画面由光影自己处理。
underwaterOverlay = false
# 半透明物体参与阴影绘制。
shadowTranslucent = true
# 太阳几何不画：天空背景全部由延迟阶段的自定义天空绘制，天空像素里只留日月贴图。
sun = false
# 月亮几何照画，供天空效果读取月亮贴图。
moon = true
# 星星几何照画，供天空效果读取星空。
stars = true
# 原版暗角关闭，暗角由后期阶段自己算。
vignette = false
# 环境光遮蔽分开处理，避免原版遮蔽和 `GTAO` 叠加两次。
separateAo = true
# 视锥剔除开启，交给加载器剔除看不见的区块。
frustum.culling = true
# 阴影剔除关闭，阴影相机覆盖的范围和主相机不同，剔除会漏掉投影物。
shadow.culling = false
# 粒子在延迟阶段之前绘制，让粒子能读到延迟阶段算出的光照。
particles.before.deferred = false

# --- 程序开关：按选项决定某个阶段是否执行 ---
# 云影模糊只在开启云影时执行。
program.world0/deferred4.enabled=OMNI_CLOUD_SHADOW
# 云影模糊的第二遍。
program.world0/deferred5.enabled=OMNI_CLOUD_SHADOW
# 末地云影模糊只做横向一遍。
program.world1/deferred4.enabled=OMNI_CLOUD_SHADOW

# 反射阴影图全局光只在开启它时执行。
program.world0/deferred1.enabled=OMNI_GI_RSM
# 末地同样只在开启时执行。
program.world1/deferred1.enabled=OMNI_GI_RSM

# 反射小波滤波第一遍只在开启物理光照时执行。
program.world0/composite3.enabled=OMNI_ENABLE_PBR
# 反射小波滤波第二遍，半径更小。
program.world0/composite4.enabled=OMNI_ENABLE_PBR
# 下界同样两遍。
program.world-1/composite3.enabled=OMNI_ENABLE_PBR
# 下界第二遍。
program.world-1/composite4.enabled=OMNI_ENABLE_PBR
# 末地同样两遍。
program.world1/composite3.enabled=OMNI_ENABLE_PBR
# 末地第二遍。
program.world1/composite4.enabled=OMNI_ENABLE_PBR

# 景深只在开启时执行。
program.world0/composite6.enabled=OMNI_DOF
# 下界同样只在开启时执行。
program.world-1/composite6.enabled=OMNI_DOF
# 末地同样只在开启时执行。
program.world1/composite6.enabled=OMNI_DOF

# 蜘蛛眼发光只在开启眼部光照时执行。
program.world0/gbuffers_spidereyes.enabled=OMNI_EYES_LIGHTING
# 下界蜘蛛眼同样只在开启时执行。
program.world-1/gbuffers_spidereyes.enabled=OMNI_EYES_LIGHTING
# 末地蜘蛛眼同样只在开启时执行。
program.world1/gbuffers_spidereyes.enabled=OMNI_EYES_LIGHTING

# 锐化与放大只在开启 `FSR` 且游戏版本支持时执行；不满足时明确关掉这几个程序。
#if defined OMNI_FSR && MC_VERSION >= 11801
# 主世界锐化阶段只在开启时执行。
	program.world0/composite15.enabled=OMNI_FSR
# 主世界放大阶段只在开启时执行。
	program.world0/composite16.enabled=OMNI_FSR
# 下界放大阶段只在开启时执行。
	program.world-1/composite16.enabled=OMNI_FSR
# 末地放大阶段只在开启时执行。
	program.world1/composite16.enabled=OMNI_FSR
# 不满足条件时，下面这些阶段明确关闭，避免加载器按默认值执行。
#else
# 主世界锐化阶段关闭。
	program.world0/composite15.enabled=false
# 主世界放大阶段关闭。
	program.world0/composite16.enabled=false
# 下界放大阶段关闭。
	program.world-1/composite16.enabled=false
# 末地放大阶段关闭。
	program.world1/composite16.enabled=false
#endif

# 远景阴影只在开启时执行。
#ifdef OMNI_DH_SHADOW
# 开启远景阴影时让加载器绘制远景阴影图。
	dhShadow.enabled = true
# 关闭时明确关掉，避免加载器按默认值执行。
#else
	dhShadow.enabled = false
#endif

# 合成五号阶段把一号画面换到七号，给时间抗锯齿留出历史位置。
flip.composite5.colortex7=true

# 泛光降采样与升采样链第一级只在开启泛光时执行。
program.world0/composite9.enabled=OMNI_BLOOM
# 泛光链第二级。
program.world0/composite10.enabled=OMNI_BLOOM
# 泛光链第三级。
program.world0/composite11.enabled=OMNI_BLOOM
# 泛光链第四级。
program.world0/composite12.enabled=OMNI_BLOOM
# 泛光链第五级。
program.world0/composite13.enabled=OMNI_BLOOM

# 下界泛光链第一级。
program.world-1/composite9.enabled=OMNI_BLOOM
# 下界泛光链第二级。
program.world-1/composite10.enabled=OMNI_BLOOM
# 下界泛光链第三级。
program.world-1/composite11.enabled=OMNI_BLOOM
# 下界泛光链第四级。
program.world-1/composite12.enabled=OMNI_BLOOM
# 下界泛光链第五级。
program.world-1/composite13.enabled=OMNI_BLOOM

# 末地泛光链第一级。
program.world1/composite9.enabled=OMNI_BLOOM
# 末地泛光链第二级。
program.world1/composite10.enabled=OMNI_BLOOM
# 末地泛光链第三级。
program.world1/composite11.enabled=OMNI_BLOOM
# 末地泛光链第四级。
program.world1/composite12.enabled=OMNI_BLOOM
# 末地泛光链第五级。
program.world1/composite13.enabled=OMNI_BLOOM

# --- 透明测试：关闭加载器的自动丢弃，丢弃判断写在光影里，才能配合植物摆动与视差 ---
# 基础几何的透明丢弃由光影自己判断。
alphaTest.gbuffers_basic        = off
# 线条程序不做透明丢弃。
alphaTest.gbuffers_line         = off
# 贴图几何的透明丢弃由光影自己判断。
alphaTest.gbuffers_textured     = off
# 受光照贴图几何的透明丢弃由光影自己判断。
alphaTest.gbuffers_textured_lit = off
# 天空基础程序不做透明丢弃。
alphaTest.gbuffers_skybasic     = off
# 天空贴图程序不做透明丢弃。
alphaTest.gbuffers_skytextured  = off
# 远景地形的透明丢弃由光影自己判断。
alphaTest.dh_terrain            = off
# 地形的透明丢弃由光影自己判断，视差与植物摆动都依赖它。
alphaTest.gbuffers_terrain      = off
# 方块破坏叠加不做透明丢弃。
alphaTest.gbuffers_damagedblock = off
# 方块实体的透明丢弃由光影自己判断。
alphaTest.gbuffers_block        = off
# 实体的透明丢弃由光影自己判断。
alphaTest.gbuffers_entities     = off
# 附魔光不做透明丢弃。
alphaTest.gbuffers_armor_glint  = off
# 蜘蛛眼不做透明丢弃。
alphaTest.gbuffers_spidereyes   = off
# 手持物的透明丢弃由光影自己判断。
alphaTest.gbuffers_hand         = off
# 雨雪程序不做透明丢弃。
alphaTest.gbuffers_weather      = off
# 远景水的透明丢弃由光影自己判断。
alphaTest.dh_water              = off
# 水的透明丢弃由光影自己判断。
alphaTest.gbuffers_water        = off
# 手持水的透明丢弃由光影自己判断。
alphaTest.gbuffers_hand_water   = off

# --- 混合方式：逐程序、逐画面指定，覆盖加载器默认值 ---
# 基础几何不混合，直接覆盖。
blend.gbuffers_basic                = off
# 线条不混合。
blend.gbuffers_line                 = off
# 贴图几何不混合。
blend.gbuffers_textured             = off
# 受光照的贴图几何不混合。
blend.gbuffers_textured_lit         = off
# 天空基础叠加：只加上天空颜色，不改底层透明度。
blend.gbuffers_skybasic             = SRC_ALPHA ONE ZERO ONE
# 天空贴图（日月）同样叠加。
blend.gbuffers_skytextured          = SRC_ALPHA ONE ZERO ONE
# 远景地形不混合。
blend.dh_terrain                    = off
# 地形不混合。
blend.gbuffers_terrain              = off
# 方块破坏叠加不混合。
blend.gbuffers_damagedblock         = off
# 方块实体整体不混合。
blend.gbuffers_block                = off
# 方块实体的颜色按透明度混到底层。
blend.gbuffers_block.colortex0      = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
# 实体整体不混合。
blend.gbuffers_entities             = off
# 实体的颜色按透明度混到底层。
blend.gbuffers_entities.colortex0   = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
# 附魔光把自身颜色乘到底层，越亮越白。
blend.gbuffers_armor_glint          = SRC_COLOR ONE ZERO ONE
# 蜘蛛眼整体不混合。
blend.gbuffers_spidereyes           = off
# 蜘蛛眼的颜色按透明度混到底层。
blend.gbuffers_spidereyes.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
# 手持物整体不混合。
blend.gbuffers_hand                 = off
# 手持物的颜色按透明度混到底层。
blend.gbuffers_hand.colortex0       = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
# 天气程序把雨雪遮罩乘进零号透明度，颜色本身不加。
blend.gbuffers_weather              = ZERO ONE ZERO ONE_MINUS_SRC_ALPHA

# 远景水整体不混合。
blend.dh_water                      = off
# 远景水的颜色材质按目标透明度混合，多层水叠起来会更暗。
blend.dh_water.colortex6            = ONE ZERO ONE_MINUS_DST_ALPHA ONE
# 近景水整体不混合。
blend.gbuffers_water                = off
# 近景水的颜色材质按目标透明度混合。
blend.gbuffers_water.colortex6      = ONE ZERO ONE_MINUS_DST_ALPHA ONE
# 水的贴图色按自身透明度混到底层。
blend.gbuffers_water.colortex0      = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
# 手持水整体不混合。
blend.gbuffers_hand_water           = off
# 手持水的颜色材质直接覆盖，不做透明度混合。
blend.gbuffers_hand_water.colortex6 = ONE ZERO ZERO ONE

# --- 贴图绑定：把自定义贴图挂到加载器提供的采样器上 ---
# 第一张涟漪动画贴图，水面雨点圈用它。
texture.gbuffers.gaux1=texture/RippleAnimation1.png
# 第二张涟漪动画贴图。
texture.gbuffers.gaux2=texture/RippleAnimation2.png
# 第三张涟漪动画贴图。
texture.gbuffers.gaux3=texture/RippleAnimation3.png
# 四号辅助贴图绑定方块图集，视差与法线按图集坐标取。
texture.gbuffers.gaux4=minecraft:textures/atlas/blocks.png

# 噪声贴图：六十四像素蓝噪声，时间噪声与抖动都读它。
texture.noise=texture/noise.png

# 延迟阶段四号画面换成一百二十八立方云噪声，字段顺序是文件、类型、内部格式、长宽深、像素格式、像素类型。
texture.deferred.colortex4=texture/CloudNoise_128_128_128.bin TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE
# 延迟阶段六号画面换成三十二立方细节云噪声。
texture.deferred.colortex6=texture/CloudNoise2_32_32_32.bin TEXTURE_3D RGB8 32 32 32 RGB UNSIGNED_BYTE

# 一点一六点五以后大气数据挂在八号画面上；更早的版本挂到二号深度上，因为旧版没有八号画面。
#if MC_VERSION >= 11605
# 延迟阶段读预计算大气三维贴图。
	texture.deferred.colortex8.0=texture/AtmoData_620_540_440_n4.bin TEXTURE_3D RGBA32F 512 128 33 RGBA FLOAT
# 延迟阶段同时挂标题图标贴图。
	texture.deferred.colortex8.1=texture/itt320.png
# 合成阶段同样读预计算大气三维贴图，天空与反射共用同一份。
	texture.composite.colortex8.0=texture/AtmoData_620_540_440_n4.bin TEXTURE_3D RGBA32F 512 128 33 RGBA FLOAT
# 合成阶段同时挂标题图标贴图。
	texture.composite.colortex8.1=texture/itt320.png
# 旧版没有八号画面，把大气数据挂到二号深度上。
#else
# 旧版延迟阶段读预计算大气三维贴图。
	texture.deferred.depthtex2.0=texture/AtmoData_620_540_440_n4.bin TEXTURE_3D RGBA32F 512 128 33 RGBA FLOAT
# 旧版延迟阶段同时挂标题图标贴图。
	texture.deferred.depthtex2.1=texture/itt320.png
# 旧版合成阶段读预计算大气三维贴图。
	texture.composite.depthtex2.0=texture/AtmoData_620_540_440_n4.bin TEXTURE_3D RGBA32F 512 128 33 RGBA FLOAT
# 旧版合成阶段同时挂标题图标贴图。
	texture.composite.depthtex2.1=texture/itt320.png
#endif

# 八号画面按两倍分辨率渲染，放大阶段才有足够细节。
size.buffer.colortex8=2.0 2.0

# --- 自定义输入：加载器按表达式每帧算好，光影直接当输入量使用 ---
# 一点一六以后才有群系判断，下界五个群系各有一个平滑权重，用来给下界配色做过渡。
#if MC_VERSION >= 11600
# 下界荒地的权重：除去其他四个群系之外都算。
	uniform.float.BiomeNetherWastesSmooth   = smooth(1, if(!in(biome, BIOME_SOUL_SAND_VALLEY, BIOME_CRIMSON_FOREST, BIOME_WARPED_FOREST, BIOME_BASALT_DELTAS), 1.0, 0.0), 5.0, 5.0)
# 灵魂沙峡谷的权重。
	uniform.float.BiomeSoulSandValleySmooth = smooth(2, if(biome == BIOME_SOUL_SAND_VALLEY, 1.0, 0.0), 5.0, 5.0)
# 绯红森林的权重。
	uniform.float.BiomeCrimsonForestSmooth  = smooth(3, if(biome == BIOME_CRIMSON_FOREST  , 1.0, 0.0), 5.0, 5.0)
# 诡异森林的权重。
	uniform.float.BiomeWarpedForestSmooth   = smooth(4, if(biome == BIOME_WARPED_FOREST   , 1.0, 0.0), 5.0, 5.0)
# 玄武岩三角洲的权重。
	uniform.float.BiomeBasaltDeltasSmooth   = smooth(5, if(biome == BIOME_BASALT_DELTAS   , 1.0, 0.0), 5.0, 5.0)
# 旧版本没有群系判断，固定按荒地处理。
#else
	uniform.float.BiomeNetherWastesSmooth   = 1.0
#endif

# 画面尺寸，按屏幕坐标采样时要用。
uniform.vec2.screenSize = vec2(viewWidth, viewHeight)
# 一个像素的坐标大小。
uniform.vec2.pixelSize  = vec2(1.0 / viewWidth, 1.0 / viewHeight)

# 眼部亮度按六次方曲线平滑，暗处变化更明显，洞穴判断更稳。
uniform.float.eyeBrightnessSmoothCurved = smooth(6, pow(clamp(eyeBrightness.y * 0.00527, 0.0, 1.0), 6.0), 7.0, 5.0)
# 完全没有天空光的标记，用于判断是否在封闭空间。
uniform.float.eyeBrightnessZeroSmooth   = smooth(7, if(eyeBrightness.y == 0,   1.0, 0.0), 4.0, 10.0)
# 天空光满值的标记。
uniform.float.eyeBrightnessOneSmooth    = smooth(8, if(eyeBrightness.y == 240, 1.0, 0.0), 4.0, 4.0)
# 所在群系下雪的标记，用来让湿润度更快上升。
uniform.float.eyeSnowySmooth = smooth(9, if(biome_precipitation > 1.5, 1.0, 0.0), 4.0, 7.0)
# 所在群系不降水的标记，用来让湿润度更快下降。
uniform.float.eyeNoPrecipitationSmooth = smooth(10, if(biome_precipitation < 0.5, 1.0, 0.0), 7.0, 7.0)

# 帧时间因子：把帧间隔换成一个稳定的小数，帧率波动时镜头平滑不跟着抖。
variable.float.frameTimeFactor = 0.003183099 / if(frameTime == 0, 5, frameTime)
# 俯仰角速度：由当前与上一帧相机矩阵的差算出来。
variable.float.angleRx = asin(gbufferModelView.1.1 * gbufferPreviousModelView.1.2 - gbufferModelView.1.2 * gbufferPreviousModelView.1.1) * frameTimeFactor
# 俯仰角速度再做一次平滑，镜头拖影用。
uniform.float.eyeRxSmooth = smooth(11, angleRx, 0.7, 0.7)
# 偏航角速度。
variable.float.angleRy = asin(gbufferModelView.0.2 * gbufferPreviousModelView.0.0 - gbufferModelView.0.0 * gbufferPreviousModelView.0.2) * frameTimeFactor
# 偏航角速度的平滑值。
uniform.float.eyeRySmooth = smooth(12, angleRy, 0.7, 0.7)

# 潜行状态的平滑值，潜行时暗角渐入渐出。
uniform.float.isSneakingSmooth = smooth(13, if(is_sneaking, 1.0, 0.0), 1.0, 0.5)

# 时间抗锯齿抖动序列：十六帧一循环，帧数取余得到序号。
variable.int.taaJitterIndex = frameCounter % 16
# 抖动偏移写成一行：加载器设置是单行键值格式，反斜杠续行会让解析器把下一行当成新键。
uniform.vec2.taaJitter = vec2((if(taaJitterIndex == 0, -1.00000, taaJitterIndex == 1, 0.50976, taaJitterIndex == 2, 0.01951, taaJitterIndex == 3, -0.47073, taaJitterIndex == 4, -0.96098, taaJitterIndex == 5, 0.54878, taaJitterIndex == 6, 0.05853, taaJitterIndex == 7, -0.43171, taaJitterIndex == 8, -0.92196, taaJitterIndex == 9, 0.58780, taaJitterIndex == 10, 0.09755, taaJitterIndex == 11, -0.39269, taaJitterIndex == 12, -0.88294, taaJitterIndex == 13, 0.62682, taaJitterIndex == 14, 0.13657, taaJitterIndex == 15, -0.35367, 0.0)) / viewWidth, (if(taaJitterIndex == 0, -1.00000, taaJitterIndex == 1, 0.13968, taaJitterIndex == 2, -0.72064, taaJitterIndex == 3, 0.41904, taaJitterIndex == 4, -0.44128, taaJitterIndex == 5, 0.69840, taaJitterIndex == 6, -0.16191, taaJitterIndex == 7, 0.97776, taaJitterIndex == 8, 0.11744, taaJitterIndex == 9, -0.74287, taaJitterIndex == 10, 0.39680, taaJitterIndex == 11, -0.46351, taaJitterIndex == 12, 0.67617, taaJitterIndex == 13, -0.18415, taaJitterIndex == 14, 0.95553, taaJitterIndex == 15, 0.09521, 0.0)) / viewHeight)

# --- Omni 保留的可选能力与光传播体积 ---
# 可选能力缺失时按保守路径回退：实体分离缺失时用透明拒绝策略，计算着色器缺失时跳过体积光计算，
# 自定义图像缺失时体积光回退屏幕空间间接光。
iris.features.optional=ENTITY_TRANSLUCENT COMPUTE_SHADERS CUSTOM_IMAGES
# 光传播体积：计算阶段写入，片元阶段读取；未游戏验证。
# 字段顺序按加载器要求：采样器名 图像格式 像素格式 像素类型 每帧清除 相对尺寸 长 宽 深。
image.omniLpvA = omniLpvTex rgba rgba8 float false false 8 8 8
# 传播目标图像与源图像交替使用同一个体积格。
image.omniLpvB = omniLpvTexB rgba rgba8 float false false 8 8 8
